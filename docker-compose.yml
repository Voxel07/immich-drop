services:
  immich-drop:
    image: ghcr.io/voxel07/immich-drop:latest
    pull_policy: always
    container_name: immich-drop
    restart: unless-stopped
    ports:
      - "8080:8080"

    # Secrets come from a .env file next to this compose file (never commit it)
    environment:
      # Immich connection (must include /api)
      IMMICH_BASE_URL: https://immich.example.com/api
      IMMICH_API_KEY: ${IMMICH_API_KEY}
      # Base URL used to build absolute invite links
      PUBLIC_BASE_URL: https://drop.example.com
      # Enable/Disable the public upload page at /
      PUBLIC_UPLOAD_PAGE_ENABLED: "false"
      IMMICH_ALBUM_NAME: dead-drop
      # Chunked uploads to bypass 100MB limits (e.g., Cloudflare Tunnel)
      CHUNKED_UPLOADS_ENABLED: "true"
      CHUNK_SIZE_MB: "95"
      # Keeps logins valid across restarts; generate with: openssl rand -hex 32
      SESSION_SECRET: ${SESSION_SECRET}
      # Timezone used for photos whose EXIF date has no offset
      TZ: Europe/Berlin
      # Behind a reverse proxy: trust its X-Forwarded-For so uploader IPs are logged correctly
      # FORWARDED_ALLOW_IPS: "*"

    volumes:
      - immich_drop_data:/data

volumes:
  immich_drop_data:
